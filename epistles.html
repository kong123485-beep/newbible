:root {
  --bg: #f3f1ea;
  --surface: #fffdf8;
  --surface-2: #eef2f6;
  --ink: #17233a;
  --muted: #607083;
  --line: #d9ddd3;
  --navy: #173a5e;
  --navy-2: #0f2740;
  --gold: #c39a3f;
}

  :root {
    --bg: #0f1725;
    --surface: #172335;
    --surface-2: #1d2c42;
    --ink: #f0eadb;
    --muted: #aab7c7;
    --line: #34455f;
    --navy: #1b3e63;

}

}

  font-family: "Noto Serif TC", serif;
}

.no-scrollbar::-webkit-scrollbar {

聖潔與愛；恩賜要在愛中運用",chapters:[{label:"1–4 章",text:"責備結黨紛爭，提醒信徒不應高舉個別領袖，十字架才是中心的智慧。"},{label:"5–7 章",text:"處理道德與家庭問題，包括紀律、婚姻與單身，強調身體是聖靈的殿。"},{label:"8–11 章",text:"論祭偶像之物、崇拜秩序與主的晚餐，提醒自由要以愛心為界限。"},{label:"12–16 章",text:"論屬靈恩賜、愛的篇章與基督復活，最後鼓勵信徒堅定站立。"}],verseRef:"哥林多前書 13:13",verse:"如今常存的有信，有望，有愛這三樣，其中最大的是愛。",apply:"在意見不同時，先問：我的說話與選擇，是否讓人感受到愛，而不只是贏得道理？"},{name:"哥林多後書",short:"林後",cat:"保羅書信",recipient:"哥林多教會",intro:"保羅為使徒職分辯護，並在責備與安慰之間，表明新約執事的榮耀。",author:"使徒保羅",time:"約公元 56 年",place:"馬其頓",background:"有假教師質疑保羅的使徒身分與動機，教會關係一度緊張。保羅一面為自己辯護，一面表明真正的事奉不是靠外貌，而是靠基督的愛與受苦。",theme:"安慰、和好與真實事奉；軟弱中顯出基督的能力",chapters:[{label:"1–3 章",text:"神是賜安慰的神；保羅說明自己行蹤的改變，並論新約執事的榮耀超越舊約。"},{label:"4–7 章",text:"寶貝放在瓦器裡，雖然外體毀壞，內心卻一天新似一天；神使信徒與祂和好。"},{label:"8–9 章",text:"以馬其頓教會為榜樣，鼓勵哥林多信徒甘心樂意地捐助耶路撒冷聖徒。"},{label:"10–13 章",text:"面對假使徒的挑戰，保羅以軟弱與受苦表明使徒的記號，最後勸勉教會自省。"}],verseRef:"哥林多後書 5:17",verse:"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。",apply:"不要用過去定義自己。每天都可以重新選擇：讓基督的愛，成為你今天的起點。"},{name:"加拉太書",short:"加",cat:"保羅書信",recipient:"加拉太眾教會",intro:"嚴厲駁斥靠律法稱義的錯誤教導，捍衛唯獨因信稱義的福音。",author:"使徒保羅",time:"約公元 48–49 年",place:"敘利亞安提阿一帶",background:"有人教導外邦信徒必須受割禮、遵守摩西律法才能得救。加拉太信徒動搖，保羅寫下語氣最強烈的書信，捍衛福音的純正。",theme:"因信稱義；基督裡的自由與聖靈的果子",chapters:[{label:"1–2 章",text:"保羅見證自己的使徒職分來自基督，並記載他曾在安提阿為福音據理力爭。"},{label:"3–4 章",text:"以亞伯拉罕與律法的功用說明：人是因信稱義，律法是訓蒙的師傅，引人到基督那裡。"},{label:"5 章",text:"基督釋放人得自由，不是要放縱，而是要用愛心互相服事，並順著聖靈而行。"},{label:"6 章",text:"論彼此擔當重擔、種與收的原則，以及在十字架面前的新創造。"}],verseRef:"加拉太書 5:1",verse:"基督釋放了我們，叫我們得以自由。所以要站立得穩，不要再被奴僕的軛挾制。",apply:"自由不是「想做什麼就做什麼」，而是「不再被比較、恐懼與罪綑綁」。"},{name:"以弗所書",short:"弗",cat:"監獄書信",recipient:"以弗所教會",intro:"論教會是基督的身體，信徒在基督裡的豐盛身分與合一生活。",author:"使徒保羅",time:"約公元 60–62 年",place:"羅馬（監獄中）",background:"保羅在羅馬被囚，卻寫出滿有屬天眼光的書信。當時教會需要明白：猶太人與外邦人已在基督裡成為一體，不再隔絕。",theme:"在基督裡的豐盛與合一；教會是基督的身體",chapters:[{label:"1–2 章",text:"在基督裡蒙揀選、得救贖；人原是死在過犯中，靠恩典得救，成為神手中的工作。"},{label:"3 章",text:"保羅揭示教會的奧祕：外邦人與猶太人在基督裡同為後嗣，成就神永恆的旨意。"},{label:"4 章",text:"以合一為基礎，按著各人的恩賜建立教會，脫去舊人，穿上新人。"},{label:"5–6 章",text:"論家庭、夫妻、親子與主僕關係，並穿戴神所賜的全副軍裝，站穩抵擋仇敵。"}],verseRef:"以弗所書 2:8",verse:"你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的。",apply:"今天花一分鐘安靜提醒自己：你的價值不是由工作表現決定，而是由基督的愛決定。"},{name:"腓立比書",short:"腓",cat:"監獄書信",recipient:"腓立比教會",intro:"在受苦與捆鎖中，仍流露出「靠主常常喜樂」的生命。",author:"使徒保羅",time:"約公元 61 年",place:"羅馬（監獄中）",background:"腓立比教會是保羅在歐洲建立的第一間教會，長期支持他的宣教工作。保羅在獄中寫信，多謝他們的餽送，並勸勉他們在逼迫與分歧中同心。",theme:"以基督為至寶；謙卑、合一與在主裡的喜樂",chapters:[{label:"1 章",text:"保羅在捆鎖中仍看見福音興旺，說出「因我活著就是基督，我死了就有益處」的心志。"},{label:"2 章",text:"以基督倒空自己、降卑順服為榜樣，勸勉信徒同心合意，彼此謙讓。"},{label:"3 章",text:"保羅視萬事如糞土，以認識基督為至寶，並向著標竿直跑。"},{label:"4 章",text:"勸勉要在主裡常常喜樂，將憂慮帶到神面前，學習知足與靠主得力。"}],verseRef:"腓立比書 4:4",verse:"你們要靠主常常喜樂。我再說，你們要喜樂。",apply:"喜樂不是否認困難，而是選擇在困難中，仍然信靠那位與你同在的主。"},{name:"歌羅西書",short:"西",cat:"監獄書信",recipient:"歌羅西教會",intro:"高舉基督是萬有之首，駁斥混合神秘主義與律法主義的錯誤教導。",author:"使徒保羅",time:"約公元 60–62 年",place:"羅馬（監獄中）",background:"歌羅西教會受到混合猶太律法、神秘異象與天使崇拜的錯誤思想影響。保羅未曾親身到訪，卻寫信提醒信徒：基督已經足夠，不需要另加別的條件。",theme:"基督的超越性與足夠性；在祂裡面豐豐富富",chapters:[{label:"1 章",text:"基督是首生的，是萬有的創造者與教會的元首，神的豐盛都住在祂裡面。"},{label:"2 章",text:"警告信徒不要被空洞的哲學與人為規條擄去，因為在基督裡已得著豐盛。"},{label:"3 章",text:"與基督一同復活的人，要思念上面的事，脫去舊人，穿上新人，彼此饒恕。"},{label:"4 章",text:"勸勉信徒恆切禱告，用智慧與外人交往，說話常常帶著和氣。"}],verseRef:"歌羅西書 3:2",verse:"你們要思念上面的事，不要思念地上的事。",apply:"當手機資訊令你焦慮時，先停一停：把眼光從「別人的生活」轉回「神給你的今天」。"},{name:"帖撒羅尼迦前書",short:"帖前",cat:"保羅書信",recipient:"帖撒羅尼迦教會",intro:"安慰受逼迫的年輕教會，並堅固他們對基督再來的盼望。",author:"使徒保羅",time:"約公元 50–51 年",place:"哥林多",background:"帖撒羅尼迦教會成立不久就遭遇逼迫，保羅被迫離開，掛念他們的信心。他寫信肯定他們的信心、愛心與盼望，並解答關於已逝信徒的問題。",theme:"聖潔、盼望與基督再來；在逼迫中堅定信心",chapters:[{label:"1–2 章",text:"保羅記念他們信心所作的工夫，憶述自己像母親與父親一樣牧養他們。"},{label:"3 章",text:"差派提摩太去堅固他們，得知他們在患難中仍站立得穩，保羅滿心安慰。"},{label:"4 章",text:"勸勉信徒遠避淫行，過聖潔生活，並安慰他們：主再來時，已睡的信徒必先復活。"},{label:"5 章",text:"主的日子來到像夜間的賊，信徒要警醒謹守，彼此勸慰，凡事謝恩。"}],verseRef:"帖撒羅尼迦前書 5:16–18",verse:"要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。",apply:"今天試著把一件小事也化為感恩：能呼吸、能吃飯、能與人聯繫，都是恩典。"},{name:"帖撒羅尼迦後書",short:"帖後",cat:"保羅書信",recipient:"帖撒羅尼迦教會",intro:"澄清關於主再來的誤解，勸勉信徒一面等候，一面忠心工作。",author:"使徒保羅",time:"約公元 51–52 年",place:"哥林多",background:"有人誤傳主的日子已經來到，有人因此驚慌，也有人放棄工作、閒懶度日。保羅寫信糾正錯誤信息，說明主再來之前必有預兆，並勸勉信徒不可閒懶。",theme:"基督再來的真理；患難中的堅忍與忠心工作",chapters:[{label:"1 章",text:"神在患難中仍是公義的，信徒的堅忍與信心，在受苦中反成為神國的明證。"},{label:"2 章",text:"澄清主的日子尚未到來，說明在大罪人顯露之前，必先有離道反教的事。"},{label:"3 章",text:"勸勉信徒不可閒懶，要效法保羅親手作工的榜樣，安靜作工，吃自己的飯。"}],verseRef:"帖撒羅尼迦後書 3:3",verse:"但主是信實的，要堅固你們，保護你們脫離那惡者。",apply:"當你對未來感到不安，記得：你的安全感不是來自掌控一切，而是來自信實的主。"},{name:"提摩太前書",short:"提前",cat:"教牧書信",recipient:"提摩太",intro:"指導年輕牧者如何管理教會、按立領袖與捍衛純正真理。",author:"使徒保羅",time:"約公元 62–64 年",place:"馬其頓",background:"保羅把提摩太留在以弗所，面對傳異端、爭辯家譜與混亂的教會秩序。保羅寫信指導他如何選立長老與執事，建立健康的教會生活。",theme:"教會的秩序與真理；敬虔是最大的得著",chapters:[{label:"1 章",text:"警告不要傳異教、講荒渺的言語與無窮的家譜，提醒命令的總歸就是愛。"},{label:"2–3 章",text:"論公共崇拜與禱告，並列出監督與執事的資格，說明教會是真理的柱石和根基。"},{label:"4 章",text:"提醒提摩太要作好榜樣，在言語、行為、愛心、信心、清潔上都成為信徒的榜樣。"},{label:"5–6 章",text:"論對待不同群體、寡婦與長老的原則，並警告貪財是萬惡之根。"}],verseRef:"提摩太前書 4:12",verse:"不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。",apply:"年齡不是影響力的上限。先在小事上忠心，別人自然會看見你生命的榜樣。"},{name:"提摩太後書",short:"提後",cat:"教牧書信",recipient:"提摩太",intro:"保羅在獄中寫下的臨終遺言，勉勵同工在艱難時代仍要傳道、守道。",author:"使徒保羅",time:"約公元 67 年",place:"羅馬（監獄中）",background:"保羅第二次被囚於羅馬，知道自己離世的時候近了，身邊同工相繼離開。他寫信給最親近的屬靈兒子提摩太，託付福音的棒子。",theme:"持守真道、忍受苦難；聖經足以使人完全",chapters:[{label:"1 章",text:"勉勵提摩太要把神所賜的恩賜如火挑旺起來，不要以為主作見證為恥。"},{label:"2 章",text:"要作基督耶穌的精兵，忍受苦難，在真道上站立得穩，遠避世俗的言語。"},{label:"3 章",text:"預言末世必有危險的日子，提醒提摩太要持守所學習的聖經，因為聖經都是神所默示的。"},{label:"4 章",text:"保羅回顧一生：那美好的仗已經打過了，並囑咐提摩太務要傳道。"}],verseRef:"提摩太後書 4:7",verse:"那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。",apply:"不用等到人生完美才開始忠心。今天的一步——堅持、誠實、愛人——就是打美好的仗。"},{name:"提多書",short:"多",cat:"教牧書信",recipient:"提多",intro:"指導如何在克里特島建立秩序井然、教導純正的教會。",author:"使徒保羅",time:"約公元 63–64 年",place:"馬其頓一帶",background:"提多被留在克里特島，那裡社會風氣敗壞，教會需要建立領袖、糾正錯誤教導。保羅寫信指導他按立長老，並教導不同群體過敬虔生活。",theme:"健全的教義與敬虔的生活；恩典教導人過聖潔生活",chapters:[{label:"1 章",text:"論長老的資格與職責，並指出要駁倒傳虛言、迷惑人的錯誤教師。"},{label:"2 章",text:"按年齡與身分教導各群體：老年人、少年人、婦女與奴僕都要在生活上顯出純正教訓。"},{label:"3 章",text:"提醒信徒要順服掌權者，存心謙卑，因為人得救是出於神的憐憫，不是靠自己的義。"}],verseRef:"提多書 3:5",verse:"他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。",apply:"當你想靠自己「做好一點」才親近神時，記得：救恩的起點是祂的憐憫，不是你的表現。"},{name:"腓利門書",short:"門",cat:"監獄書信",recipient:"腓利門",intro:"一封最短的個人書信，卻深刻呈現福音如何改變人與人的關係。",author:"使徒保羅",time:"約公元 60–62 年",place:"羅馬（監獄中）",background:"逃跑的奴隸阿尼西謀在羅馬遇見保羅並信主。保羅寫信給他的主人腓利門，懇求他不再以奴隸看待阿尼西謀，而是接納他為親愛的弟兄。",theme:"在基督裡的接納與饒恕；福音重塑人際關係",chapters:[{label:"1–7 節",text:"保羅稱讚腓利門的愛心與信心，並為他代禱，肯定他曾使眾聖徒的心得暢快。"},{label:"8–16 節",text:"保羅沒有用權柄命令，而是以愛懇求腓利門接納阿尼西謀，如同接納保羅自己。"},{label:"17–25 節",text:"保羅願意為阿尼西謀償還虧欠，盼望腓利門以愛心接待他，並預備住處迎接保羅。"}],verseRef:"腓利門書 1:16",verse:"不再是奴僕，乃是高於奴僕，是親愛的兄弟。",apply:"福音不只改變你與神的關係，也會改變你看待「對方」的方式：從標籤，變成弟兄姊妹。"},{name:"希伯來書",short:"來",cat:"普通書信",recipient:"猶太基督徒",intro:"證明耶穌超越舊約一切人物與制度，祂是更美之約的大祭司。",author:"作者不詳",time:"約公元 60 年代末",place:"寫作地點不詳",background:"收信的猶太基督徒面對逼迫與疲倦，有人想回到猶太教的舊制度。作者寫信證明基督超越天使、摩西與舊約祭司，提醒他們不可離棄真道。",theme:"基督的超越性；更美之約與憑信堅持到底",chapters:[{label:"1–4 章",text:"基督超越天使與摩西，祂是神的兒子，能體恤人的軟弱，是信徒可以坦然親近的大祭司。"},{label:"5–7 章",text:"按麥基洗德的等次，基督是永遠的大祭司，祂一次獻上自己，就成就了永遠的贖罪。"},{label:"8–10 章",text:"基督帶來更美之約，舊約的祭物只是影兒，祂的血真正潔淨人的良心。"},{label:"11–13 章",text:"以信心偉人為榜樣，勉勵信徒存心忍耐，奔那擺在前頭的路程，並在生活上彼此相愛。"}],verseRef:"希伯來書 11:1",verse:"信就是所望之事的實底，是未見之事的確據。",apply:"信心不是「假裝沒問題」，而是在未看見結果時，仍選擇相信神的信實。"},{name:"雅各書",short:"雅",cat:"普通書信",recipient:"散居十二支派",intro:"強調信心必須有行為，信仰要在日常生活與言語中活出來。",author:"雅各（主耶穌的兄弟）",time:"約公元 45–49 年",place:"耶路撒冷",background:"散居各地的猶太基督徒面對試煉、貧富不均與偏待人的問題。雅各寫信提醒他們：真正的敬虔不是單單聽道，而是行道。",theme:"行道與信心並重；試煉中的忍耐與智慧",chapters:[{label:"1 章",text:"試煉生忍耐，忍耐生老練；要向神求智慧，並行道，不要單單聽道。"},{label:"2 章",text:"不可按外貌待人；信心若沒有行為就是死的，如同身體沒有靈魂一樣。"},{label:"3 章",text:"論舌頭的力量：小小的舌頭能造成大傷害，也能祝福人，需要被神約束。"},{label:"4–5 章",text:"警告貪婪、紛爭與自誇，勉勵信徒忍耐等候主來，彼此認罪，互相代求。"}],verseRef:"雅各書 1:22",verse:"只是你們要行道，不要單單聽道，自己欺哄自己。",apply:"今天選一件你已經知道該做的事——道歉、幫助、忍耐——然後真正去做。"},{name:"彼得前書",short:"彼前",cat:"普通書信",recipient:"散居寄居信徒",intro:"勉勵在火煉試驗中仍持守活潑的盼望，並以善行回應逼迫。",author:"使徒彼得",time:"約公元 62–64 年",place:"羅馬（經文稱「巴比倫」）",background:"小亞細亞一帶的基督徒因信仰遭受社會排斥與逼迫，甚至被誤解。彼得寫信鼓勵他們：受苦不是羞恥，而是與基督有分。",theme:"受苦中的盼望；寄居者身分與聖潔生活",chapters:[{label:"1 章",text:"信徒有活潑的盼望與不能朽壞的基業，試煉如火煉金子，使信心更顯寶貴。"},{label:"2 章",text:"信徒是君尊的祭司、聖潔的國度，要在外邦人中品行端正，使人歸榮耀給神。"},{label:"3–4 章",text:"論夫妻、待人與受苦的原則：不要以惡報惡，要存溫柔的心，為盼望作見證。"},{label:"5 章",text:"勉勵長老牧養群羊，年輕人要順服，並將一切憂慮卸給那位眷顧人的神。"}],verseRef:"彼得前書 5:7",verse:"你們要將一切的憂慮卸給神，因為他顧念你們。",apply:"把你今晚睡不著的那件事，用一句禱告交給神：不是逃避，而是交託。"},{name:"彼得後書",short:"彼後",cat:"普通書信",recipient:"普世教會信徒",intro:"警告要防備假師傅，並堅信主必再來，勉勵信徒在恩典中長進。",author:"使徒彼得",time:"約公元 66–68 年",place:"羅馬",background:"彼得預感自己離世的日子近了，教會內部出現否認主再來、放縱情慾的假教師。他寫信提醒信徒要防備假教導，在真道上長進。",theme:"防備假教導；主必再來與聖潔等候",chapters:[{label:"1 章",text:"神已將一切關乎生命和虔敬的事賜給信徒，要在信心上加上德行、知識與忍耐。"},{label:"2 章",text:"嚴厲警告假師傅：他們貪婪、放縱，將引進敗壞的異端，最終必受審判。"},{label:"3 章",text:"主看一日如千年，祂的耽延是寬容，要給人悔改的機會；信徒要切切仰望主再來。"}],verseRef:"彼得後書 3:9",verse:"主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。",apply:"當你覺得神「很慢」時，試著換個角度：祂的等待，可能是為了給你多一點回轉的空間。"},{name:"約翰一書",short:"約一",cat:"普通書信",recipient:"普世教會信徒",intro:"強調「神就是愛」，在真理與愛中分辨真假，確知自己有永生。",author:"使徒約翰",time:"約公元 85–95 年",place:"以弗所一帶",background:"當時教會出現否認耶穌道成肉身的錯誤思想（幻影說），信徒感到困惑。約翰寫信幫助他們分辨真理，確知自己與神的關係，並在愛中彼此相愛。",theme:"神就是光、神就是愛；確據、認罪與彼此相愛",chapters:[{label:"1–2 章",text:"神就是光，若認自己的罪，神必赦免；耶穌是中保，遵守祂命令的人，才是真正認識祂。"},{label:"3 章",text:"神的愛何等長闊：信徒稱為神的兒女，要彼此相愛，不只在言語，也在行為與誠實上。"},{label:"4 章",text:"不要凡靈都信，要試驗諸靈；神就是愛，住在愛裡面的，就是住在神裡面。"},{label:"5 章",text:"信耶穌是基督的，必得永生；約翰寫信是要叫信徒知道自己有永生。"}],verseRef:"約翰一書 4:19",verse:"我們愛，因為神先愛我們。",apply:"愛人不必等到自己夠好：先接受神的愛，愛才有力量流出去。"},{name:"約翰二書",short:"約二",cat:"普通書信",recipient:"蒙揀選的太太",intro:"一封最短的書信之一，提醒教會要在真理與愛中同行，並謹慎接待人。",author:"使徒約翰",time:"約公元 90 年左右",place:"以弗所一帶",background:"巡迴教師到處傳道，教會需要分辨誰傳的是真理。當時有傳異端的人企圖進入教會家庭，約翰提醒收信人要謹慎，不可接待傳錯誤教導的人。",theme:"真理與愛並行；防備傳異端者",chapters:[{label:"1–6 節",text:"約翰向蒙揀選的太太與兒女問安，勉勵他們要在真理與愛中彼此相愛。"},{label:"7–11 節",text:"警告有許多迷惑人的已經出來，不認耶穌是成了肉身來的；不要接待這樣的人。"},{label:"12–13 節",text:"約翰盼望能親自見面，面對面談話，使喜樂滿足。"}],verseRef:"約翰二書 1:6",verse:"我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令。",apply:"愛不是只講感覺，也包括選擇：按真理行事，就是一種溫柔而堅定的愛。"},{name:"約翰三書",short:"約三",cat:"普通書信",recipient:"該猶",intro:"稱讚接待同工的該猶，點名批評好為首、拒絕接待的丟特腓。",author:"使徒約翰",time:"約公元 90 年左右",place:"以弗所一帶",background:"教會面對兩種榜樣：該猶樂意接待巡迴傳道者，丟特腓卻好為首、拒絕接待甚至趕出接待者。約翰寫信肯定該猶，並提醒信徒要效法善，不要效法惡。",theme:"接待與真理中的同工；效法善，不效法惡",chapters:[{label:"1–8 節",text:"約翰稱讚該猶按真理而行，樂意接待出外傳道的弟兄，這是與他們同工。"},{label:"9–10 節",text:"點名批評丟特腓好為首，用惡言妄論，拒絕接待同工，攔阻別人接待。"},{label:"11–15 節",text:"勉勵該猶不要效法惡，要效法善；並稱讚低米丟有好見證，盼望早日相見。"}],verseRef:"約翰三書 1:2",verse:"親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。",apply:"真正的祝福是整全的：願你的身體、心靈與人際關係，都在真理中一同興盛。"},{name:"猶大書",short:"猶",cat:"普通書信",recipient:"被召蒙愛的人",intro:"一封語氣強烈的短信，激勵信徒為一次交付聖徒的真道竭力爭辯。",author:"猶大（雅各的兄弟）",time:"約公元 65–80 年",place:"寫作地點不詳",background:"教會內部出現把神的恩典變作放縱情慾藉口的假教師。猶大原本想寫一封論救恩的信，卻因危機臨到，改寫成一封警醒與爭辯的書信。",theme:"為真道竭力爭辯；在至聖的真道上造就自己",chapters:[{label:"1–4 節",text:"猶大說明寫信的原因：有人偷著進來，將神的恩典變作放縱的藉口。"},{label:"5–16 節",text:"以舊約歷史與天使的例子警告：假教師必受審判，他們的行為與言語顯出他們的敗壞。"},{label:"17–25 節",text:"勉勵信徒要在至聖的真道上造就自己，在聖靈裡禱告，保守自己常在神的愛中。"}],verseRef:"猶大書 1:3",verse:"親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要為從前一次交付聖徒的真道竭力地爭辯。",apply:"面對錯誤信息，不需要爭吵，但需要清楚：溫柔地站穩真理，本身就是一種保護。"}],lc=[{key:"全部",label:"全部",color:"#173a5e"},{key:"保羅書信",label:"保羅書信",color:"#2f6fb4"},{key:"監獄書信",label:"監獄書信",color:"#8b4fb0"},{key:"教牧書信",label:"教牧書信",color:"#dd7a20"},{key:"普通書信",label:"普通書信",color:"#26996a"}],V0=(e)=>lc.find((t)=>t.key===e)?.color||"#173a5e";function mo(){let[e,t]=hn.useState("全部"),[n,r]=hn.useState(""),[l,u]=hn.useState(new Set),i=hn.useMemo(()=>{let s=n.trim();return vn.filter((p)=>(e==="全部"||p.cat===e)&&(!s||[p.name,p.theme,p.verse,p.verseRef,p.recipient,p.intro,p.author].join(" ").includes(s)))},[e,n]),o=(s)=>u((p)=>{let m=new Set(p);if(m.has(s))m.delete(s);else m.add(s);return m}),a=()=>u(l.size===vn.length?new Set:new Set(vn.map((s)=>s.name)));return N("div",{"data-safe-area-inset-root":!0,style:{boxSizing:"border-box",paddingTop:"var(--safe-area-inset-top)",minHeight:"100vh",background:"var(--bg)"},children:[x("header",{style:{position:"static",background:"var(--navy)",color:"white",borderBottom:"3px solid var(--gold)"},children:N("div",{style:{maxWidth:1100,margin:"0 auto",padding:"18px 16px 14px"},children:[N("div",{style:{display:"fle
