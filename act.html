  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.border {
  border-width: 1px;
}

.outline {
  outline-style: solid;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root {
  --surface: #f2f5f9;
  --surface-2: #ffffff;
  --ink: #17233b;
  --muted: #5d6b82;
  --line: #dce4ee;
  --navy: #173a6e;
  --navy-2: #0f2a52;
  --blue: #2563b8;
  --orange: #ea6a17;
  --orange-soft: #fff3e8;
  --purple: #7c3aed;
  --purple-soft: #f4efff;
  --gold: #f3c969;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #0d1526;
    --surface-2: #152139;
    --ink: #edf2fa;
    --muted: #a8b5ca;
    --line: #2c3b58;
    --navy: #173a6e;
    --navy-2: #0b1e3c;
    --blue: #6aa5ef;
    --orange: #ff8b3d;
    --orange-soft: #3a2718;
    --purple: #b795ff;
    --purple-soft: #2b2242;
    --gold: #f3c969;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--surface);
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
  line-height: 1.65;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
}

.card-shadow {
  box-shadow: 0 8px 26px rgba(15, 42, 82, 0.08);
}

.book-tag {
  letter-spacing: .06em;
}

.verse-box {
  border-left: 3px solid var(--gold);
}

:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

體。真實的合一會帶來見證與成長，逼迫也不能攔阻福音。",verseRef:"使徒行傳 2:42",verse:"「他們都恆心遵守使徒的教訓，彼此交接，擘餅，祈禱。」",application:"建立穩定的禱告與讀經生活，並在群體中彼此扶持，信仰就不容易孤單枯乾。"},{id:"acts-8-12",book:"acts",kind:"section",range:"8–12 章",title:"福音傳到撒瑪利亞與外邦",intro:"逼迫反而使福音擴散。福音越過種族與文化的界線，撒瑪利亞人、埃提阿伯太監，甚至外邦百夫長都信了主。",people:"腓利、掃羅（保羅）、彼得、哥尼流、巴拿巴",place:"撒瑪利亞、迦薩曠野、該撒利亞、大馬士革、安提阿",events:["腓利在撒瑪利亞傳道，又向埃提阿伯太監講解聖經。","掃羅在大馬士革路上遇見復活的主，生命完全改變。","彼得看見異象，明白福音也要給外邦人。","哥尼流一家信主、受聖靈，成為外邦信徒的重要里程碑。","安提阿教會興起，門徒第一次被稱為「基督徒」。"],theology:"福音沒有圍牆。神主動打破人的偏見，叫不同背景的人在基督裡成為一家人。",verseRef:"使徒行傳 10:34–35",verse:"「我真看出神是不偏待人。原來，各國中那敬畏主、行義的人都為主所悅納。」",application:"留意身邊被忽略或與自己不同的人，學習以更寬廣的心去接納與關心。"},{id:"acts-13-14",book:"acts",kind:"section",range:"13–14 章",title:"第一次宣教旅程",intro:"安提阿教會差派巴拿巴與保羅出發，福音從塞浦路斯傳到小亞細亞多個城市，教會在各處被建立起來。",people:"保羅、巴拿巴、馬可、士求保羅",place:"安提阿、塞浦路斯、彼西底的安提阿、以哥念、路司得、特庇",events:["教會在禱告與禁食中，差派巴拿巴與保羅出去宣教。","保羅在會堂講道，說明耶穌就是舊約所應許的救主。","許多外邦人信主，但也有人嫉妒、反對，甚至用石頭打保羅。","保羅與巴拿巴回到各城，堅固門徒的心，並選立長老。"],theology:"宣教是教會與聖靈同工的行動；果效與反對常常同時出現，信徒需要堅固與牧養。",verseRef:"使徒行傳 14:22",verse:"「堅固門徒的心，勸他們恆守所信的道；又說：『我們進入神的國，必須經歷許多艱難。』」",application:"服侍或工作遇到阻力，不一定是失敗的記號；求神給你堅持下去的勇氣與同行者。"},{id:"acts-15",book:"acts",kind:"section",range:"15 章",title:"耶路撒冷會議",intro:"外邦人信主後，是否要先守猶太律法？教會領袖聚在一起尋求神的心意，作出一個影響深遠的決定。",people:"彼得、保羅、巴拿巴、雅各、猶大與西拉",place:"耶路撒冷、安提阿",events:["有人主張外邦信徒必須受割禮、遵守摩西律法。","彼得見證神同樣把聖靈賜給外邦人。","保羅與巴拿巴分享神在外邦人中的工作。","雅各引用聖經，作出總結與建議，教會寫信通知各處信徒。"],theology:"人得救是本乎恩、因著信，不是靠守律法賺取。教會在爭議中學習回到聖經、聖靈與彼此聆聽。",verseRef:"使徒行傳 15:11",verse:"「我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的。」",application:"面對意見不同時，先回到福音的核心，不讓次要的分歧破壞重要的合一。"},{id:"acts-16-18",book:"acts",kind:"section",range:"16–18 章",title:"第二次宣教旅程",intro:"保羅帶著西拉與提摩太再出發，福音第一次踏進歐洲。腓立比、帖撒羅尼迦、庇哩亞、雅典、哥林多的教會相繼誕生。",people:"保羅、西拉、提摩太、呂底亞、獄卒、百基拉與亞居拉",place:"腓立比、帖撒羅尼迦、庇哩亞、雅典、哥林多、特羅亞",events:["保羅在異象中看見馬其頓人呼求幫助，於是轉往歐洲。","呂底亞在河邊聽道信主，開放家庭接待宣教士。","保羅與西拉在腓立比坐監，卻在半夜唱詩讚美神，獄卒一家因而信主。","保羅在雅典亞略巴古向追求哲學的人講述獨一真神。","保羅在哥林多停留一年半，建立並牧養教會。"],theology:"聖靈會引導方向，甚至關上一扇門、打開另一扇門。神在意料不到的地方預備人心。",verseRef:"使徒行傳 16:31",verse:"「當信主耶穌，你和你一家都必得救。」",application:"當計劃改變時，不必立刻焦慮；留意神可能正在帶你走向新的方向與新的人。"},{id:"acts-19-20",book:"acts",kind:"section",range:"19–20 章",title:"第三次宣教旅程",intro:"保羅在以弗所長期牧養與教導，神行了許多奇事；其後他走訪各地，堅固信徒，最後在米利都向以弗所長老告別。",people:"保羅、提摩太、以拉都、底米丟、以弗所長老",place:"以弗所、馬其頓、亞該亞、特羅亞、米利都",events:["保羅在以弗所傳道約兩年，許多人離棄偶像、焚燒行邪術的書。","製造銀龕的底米丟引起騷亂，反映福音對當地偶像經濟的衝擊。","保羅在特羅亞講道，少年人猶推古打盹墜樓，後來蒙神醫治。","保羅在米利都向長老告別，提醒他們要牧養神的教會。"],theology:"福音會觸動人的生命與價值觀，帶來真實的改變。牧養不只是講道，也是以愛心守望與交託。",verseRef:"使徒行傳 20:35",verse:"「施比受更為有福。」",application:"檢視生活中的習慣與消費：哪些東西正在佔據你的心？讓信仰帶來具體的取捨與改變。"},{id:"acts-21-28",book:"acts",kind:"section",range:"21–28 章",title:"保羅被捕與上訴到羅馬",intro:"保羅回到耶路撒冷被捕，卻因羅馬公民身份上訴到該撒。他在風浪、船難與毒蛇咬傷中仍蒙保守，最終到達羅馬。",people:"保羅、路加、亞基帕王、百夫長猶流、非斯都、腓力斯",place:"耶路撒冷、該撒利亞、馬爾他、羅馬、亞底亞海",events:["保羅在耶路撒冷被捉拿，後被送往該撒利亞受審。","保羅多次為自己分訴，見證自己如何遇見基督。","保羅上訴到該撒，開始漫長的航程。","船在風暴中失事，全船的人卻因神的應許得救。","保羅到達馬爾他，醫治島上病人；最後到達羅馬，繼續傳道。"],theology:"即使被囚與遇難，神的旨意仍在前進。苦難不代表神缺席，反而可能成為見證的舞台。",verseRef:"使徒行傳 28:31",verse:"「放膽傳講神國的道，將主耶穌基督的事教導人，並沒有人禁止。」",application:"在看似被困的季節，仍可以選擇誠實、勇敢與溫柔；你的態度本身就是一種見證。"}],Dv=[{id:"rev-overview",book:"revelation",kind:"overview",range:"啟示錄 1–22 章",title:"一封給受逼迫教會的盼望書信",intro:"啟示錄不是用來令人恐懼的密碼書，而是寫給在困難中仍然堅持信仰的教會：無論世界怎樣動盪，結局是基督得勝。",people:"作者：使徒約翰",place:"寫作地點：拔摩島 · 寫作時間：約主後 95 年",events:["約翰因傳道被放逐到拔摩島，在主日領受異象。","書信的對象是小亞細亞的七間教會，代表當時真實存在的信仰群體。","全書大量使用舊約意象與象徵，幫助讀者以屬靈眼光看歷史與未來。","結尾是邀請與祝福，呼喚人來親近基督。"],theology:"核心主題：基督得勝、神最終掌權。即使惡看似強大，歷史的終局仍在神手中。",verseRef:"啟示錄 22:20",verse:"「證明這事的說：『是了，我必快來！』阿們！主耶穌啊，我願你來！」",application:"當新聞與生活令人不安時，回到一個穩固的盼望：神沒有失控，祂仍然掌權。"},{id:"rev-1",book:"revelation",kind:"section",range:"1 章",title:"異象中的基督",intro:"約翰看見復活的基督站在七個金燈臺中間。祂不再是十字架上受苦的樣子，而是榮耀、權柄與慈愛兼備的主。",symbol:"七個金燈臺代表七間教會；基督手中的七星代表教會的使者或領袖；明亮如日頭的面貌象徵祂的榮耀與聖潔。",message:"基督沒有離開祂的教會，祂正在教會中間行走、察看與看顧。即使教會軟弱，祂仍然親自同在。",verseRef:"啟示錄 1:17–18",verse:"「不要懼怕！我是首先的，我是末後的，又是那存活的；我曾死過，現在又活了，直活到永永遠遠。」",application:"感到孤單或害怕時，記得主不是遙遠的旁觀者，而是正在你身邊同行的主。"},{id:"rev-2-3",book:"revelation",kind:"section",range:"2–3 章",title:"給七間教會的信",intro:"基督逐一寫信給以弗所、士每拿、別迦摩、推雅推喇、撒狄、非拉鐵非與老底嘉，稱讚他們的忠心，也指出需要悔改的地方。",symbol:"每封信都有相似結構：基督的自稱、對教會的認識、稱讚或責備、勸勉與應許。七間教會是真實教會，也提醒歷代教會常見的軟弱與試探。",message:"神既看見我們的勞苦，也看見我們的內心。祂的責備不是為了定罪，而是邀請人回轉、重新得力。",verseRef:"啟示錄 3:20",verse:"「看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去。」",application:"安靜下來，誠實檢視信仰：是否仍有起初的愛心？願意讓基督再次敲開心門嗎？"},{id:"rev-4-5",book:"revelation",kind:"section",range:"4–5 章",title:"寶座與羔羊",intro:"異象的鏡頭轉向天上：神坐在寶座上，眾聖者不住敬拜；唯有被殺的羔羊配得展開書卷，揭開神的計劃。",symbol:"寶座代表神的掌權；羔羊代表為世人捨命的耶穌；七角七眼象徵完全的能力與智慧。敬拜不是逃避現實，而是看見誰真正掌權。",message:"地上可能混亂，但在天上，神仍坐在寶座上。羔羊的得勝方式不是用武力，而是用捨己的愛。",verseRef:"啟示錄 5:12",verse:"「曾被殺的羔羊是配得權柄、豐富、智慧、能力、尊貴、榮耀、頌讚的。」",application:"在焦慮中學習敬拜：先定睛看神的掌權，再回頭看眼前的難題，視角會不一樣。"},{id:"rev-6-11",book:"revelation",kind:"section",range:"6–11 章",title:"七印、七號、七碗",intro:"書卷被揭開，號筒吹響，碗傾倒出來。這組異象用強烈的畫面，表達罪惡與審判帶來的破壞，以及神仍然給人悔改的機會。",symbol:"七印、七號、七碗不是讓人計算日期的日曆，而是象徵神對歷史的審判與掌管。四匹馬、白衣群眾與受印的數目，表達戰爭、饑荒、死亡與神對屬祂之人的保護。",message:"神是公義的，祂不會對不公義視而不見；同時祂也是忍耐的，在審判中仍呼喚人回轉。",verseRef:"啟示錄 7:17",verse:"「因為寶座中的羔羊必牧養他們，領他們到生命水的泉源；神也必擦去他們一切的眼淚。」",application:"面對世界的不公義，不要以仇恨回應仇恨；堅持行公義、好憐憫，相信神會為受苦的人伸張公義。"},{id:"rev-12-14",book:"revelation",kind:"section",range:"12–14 章",title:"龍、獸與羔羊的爭戰",intro:"婦人、龍與獸的異象，描繪一場屬靈爭戰。龍象徵敵對神的勢力，獸代表逼迫與迷惑人的權勢；羔羊與跟隨祂的人最終站立得住。",symbol:"婦人、龍、獸、海與地的意象，表達善與惡的對抗。十四萬四千人等數目在啟示文學中常是象徵，重點不是精確的人數，而是神的子民蒙保守、屬於羔羊。",message:"逼迫與試探真實存在，但跟隨羔羊的人不是靠自己的力量得勝，而是靠羔羊的血與所見證的道。",verseRef:"啟示錄 12:11",verse:"「弟兄勝過牠，是因羔羊的血和自己所見證的道。」",application:"在壓力下仍選擇誠實、善良與忠心，就是一種得勝；不用靠攻擊別人來證明自己。"},{id:"rev-15-18",book:"revelation",kind:"section",range:"15–18 章",title:"審判與巴比倫傾倒",intro:"七位天使傾倒七碗，象徵神公義的審判；而被稱為巴比倫的大城傾倒，代表以財富、權力與偶像為中心的體系終將過去。",symbol:"巴比倫不是單指一座歷史城市，而是象徵使人離開神的驕傲、貪婪與壓迫文化。她的傾倒提醒人：一切看似永恆的帝國與財富，都不是最終的依靠。",message:"神呼喚祂的子民「從那城出來」，不要被錯誤的價值觀同化，要活出分別為聖的生命。",verseRef:"啟示錄 18:4",verse:"「我的民哪，你們要從那城出來，免得與她一同有罪。」",application:"留意金錢、名聲與比較心正在怎樣影響你的選擇；學習在物質世界中保持清醒與自由。"},{id:"rev-19-20",book:"revelation",kind:"section",range:"19–20 章",title:"基督再來與千年國度",intro:"天上響起歡呼，基督騎著白馬顯現，象徵祂最終的得勝與審判。接著是千年國度與白色大寶座審判的異象，表達神要徹底除去罪惡。",symbol:"白馬、羔羊的婚筵與千年國度，都是啟示文學的象徵畫面。基督徒對部分細節有不同理解，但共同相信：基督必再來，神的公義必完全彰顯。本頁不作日期推測。",message:"歷史不是漫無目的地重複，而是有方向、有終局。神的審判同時帶來安慰：受苦不會被遺忘，惡不會永遠得勝。",verseRef:"啟示錄 19:11",verse:"「我觀看，見天開了。有一匹白馬，騎在馬上的稱為誠信真實。」",application:"以「終局有盼望」的心態過今天：做正確的事，即使暫時看不到回報。"},{id:"rev-21-22",book:"revelation",kind:"section",range:"21–22 章",title:"新天新地與新耶路撒冷",intro:"故事以最美的結局作結：新天新地、新耶路撒冷從天而降。神親自與人同住，眼淚、死亡、悲哀與疼痛都不再有了。",symbol:"新耶路撒冷不是一座普通的城，而是神與人完全同在的象徵：城門永遠敞開、生命水的河、生命樹的葉子，表達醫治、豐盛與不再隔絕。",message:"聖經的故事從伊甸園開始，以新天新地結束——神的心意從來不是放棄世界，而是要更新與恢復一切。",verseRef:"啟示錄 21:4",verse:"「神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛。」",application:"把這份盼望帶進今天：主動去安慰、修補與幫助身邊受傷的人，預嘗新天新地的樣式。"}],Iv=[...Ov,...Dv];function Uv(){let[e,t]=Ot.useState("all"),[n,r]=Ot.useState(""),[l,o]=Ot.useState(new Set(["acts-overview","rev-overview"])),[i,u]=Ot.useState(""),a=Ot.useMemo(()=>{let d=n.trim().toLowerCase();return Iv.filter((y)=>{if(e!=="all"&&y.book!==e)return!1;if(!d)return!0;return[y.range,y.title,y.intro,y.people,y.place,y.theology,y.symbol,y.message,y.verseRef,y.verse,y.application,...y.events||[]].join(" ").toLowerCase().includes(d)})},[e,n]),c=(d)=>{o((y)=>{let k=new Set(y);if(k.has(d))k.delete(d);else k.add(d);return k})},v=(d)=>{t(d),u(d==="all"?"已顯示全部 16 張卡片。":d==="acts"?"已切換到使徒行傳：共 8 張卡片。":"已切換到啟示錄：共 8 張卡片。")};return P("div",{"data-safe-area-inset-root":!0,style:{boxSizing:"border-box",paddingTop:"var(--safe-area-inset-top)",minHeight:"100vh",background:"var(--surface)"},children:[E("header",{"data-safe-area-sticky-top":!0,style:{top:"var(--safe-area-inset-top)",position:"sticky",zIndex:20,background:"linear-gradient(135deg, #0f2a52 0%, #173a6e 58%, #1f4c8c 100%)",color:"white",boxShadow:"0 10px 30px rgba(15,42,82,.28)"},children:P("div",{style:{maxWidth:1120,margin:"0 auto",padding:"22px 18px 20px"},children:[P("div",{style:{display:"flex",alignItems:"center",gap:8,fontSize:12,letterSpacing:2,color:"#bcd3f2",fontWeight:800},children:[E(pr,{size:16})," 新約聖經 · 詳細總覽"]}),E("h1",{style:{margin:"10px 0 6px",fontSize:"clamp(28px, 7vw, 48px)",lineHeight:1.12,letterSpacing:"-.02em"},children:"使徒行傳 + 啟示錄 總覽"}),E("p",{style:{margin
